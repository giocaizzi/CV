[project]
name = "cv-builder"
version = "2.2.1"
description = "JSON-driven LaTeX CV with Jinja2 templating"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.0",
    "jsonschema>=4.0",
]

[project.scripts]
cv-build = "cv_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated, mocked dependencies)",
    "integration: Integration tests (real file I/O, no LaTeX compilation)",
]
addopts = "-v"

[tool.coverage.run]
source = ["cv_builder"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
files = ["cv_builder"]
ignore_missing_imports = true
