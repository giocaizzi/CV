name: Build CV

# Automatically rebuild CV when JSON data changes
# Allows editing JSON from mobile/web and auto-generating PDF

on:
  push:
    branches:
      - main
    paths:
      - 'data/**/*.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: uv sync --locked --no-dev

    - name: Generate .tex files
      run: uv run --no-dev cv-build

    - name: Compile LaTeX
      uses: xu-cheng/latex-action@v4
      with:
        root_file: data/*/*.tex
        work_in_root_file_dir: true
        pre_compile: |
          tlmgr update --self
          tlmgr install $(cat latex_requirements.txt | tr '\n' ' ')

    - name: Commit generated files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*/*.tex data/*/*.pdf
        git diff --staged --quiet || git commit -m "ci: rebuild CV from JSON changes"
        git push